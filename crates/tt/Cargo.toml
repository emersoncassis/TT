[package]
name = "tt"
description = "TT (Terminal Tools): free and open SSH workstation with local and web-server modes"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["getrandom", "alloc"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
mime_guess = "2.0.5"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
russh = "0.65.0"
russh-sftp = "3.0.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tt-core = { path = "../tt-core" }
