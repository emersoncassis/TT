[package]
name = "tt-core"
description = "TT core: SSH/SFTP/NETCONF sessions, device profiles and secret vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
futures = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
russh = "0.65.0"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
